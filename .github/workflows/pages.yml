name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check game assets
        id: assets
        shell: bash
        run: |
          required=(
            assets/stage.webp
            assets/rex_idle0.png
            assets/rex_idle1.png
            assets/rex_run0.png
            assets/rex_run1.png
            assets/rex_jump.png
            assets/rex_fall.png
            assets/aion_idle0.png
            assets/aion_hit.png
            assets/fx_blue_slash.png
            assets/fx_blast_fire.png
            assets/fx_hit_orange.png
          )
          missing=0
          for file in "${required[@]}"; do
            if [ ! -f "$file" ]; then
              echo "missing: $file"
              missing=1
            fi
          done
          if [ "$missing" -eq 0 ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "SKYBREAK image assets are incomplete. Skipping Pages deployment."
          fi

      - name: Configure Pages
        if: steps.assets.outputs.ready == 'true'
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Build static site
        if: steps.assets.outputs.ready == 'true'
        run: |
          mkdir -p _site
          cp index.html style.css game.js .nojekyll _site/
          cp -R assets _site/assets

      - name: Upload artifact
        if: steps.assets.outputs.ready == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        if: steps.assets.outputs.ready == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
