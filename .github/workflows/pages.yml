name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Build static site
        run: |
          mkdir -p _site/assets
          cp index.html style.css game.js .nojekyll _site/
          cat asset-b64/assets.zip.b64.part* > /tmp/assets.zip.b64
          base64 --decode /tmp/assets.zip.b64 > /tmp/assets.zip
          unzip -q /tmp/assets.zip -d _site/assets
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
